# 智能驾驶员状态监测系统 - 服务端配置文件

# 数据库连接配置
database:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: ""   # 请在项目根目录 .env 的 DB_PASSWORD 中填写密码，不要提交真实密码
  name: "driver_monitor"

# 服务器配置
server:
  host: "127.0.0.1"
  port: 5000
  debug: false

# 截图文件配置
snapshot:
  dir: "snapshots/"

# 分页配置
pagination:
  default_page_size: 20
  max_page_size: 100

# CORS 配置
cors:
  allowed_origins:
    - "http://127.0.0.1:3000"
    - "http://localhost:3000"